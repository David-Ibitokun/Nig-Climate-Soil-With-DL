<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Full dataset -->
  <g style="fill:rgb(0, 0, 0);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
    <rect x="40" y="20" width="600" height="44" rx="8" stroke-width="0.5" style="fill:rgb(240, 240, 235);stroke:rgb(140, 140, 140);color:rgb(251, 251, 254);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;"/>
    <text x="340" y="42" text-anchor="middle" dominant-baseline="central" style="fill:rgb(80, 80, 80);font-size:14px;font-weight:500;text-anchor:middle;">The complete original dataset</text>
  </g>

  <line x1="340" y1="64" x2="340" y2="92" marker-end="url(#arrow)" style="fill:none;stroke:rgb(120, 120, 120);stroke-width:1.5px;"/>
  <text x="380" y="72" dominant-baseline="central" style="fill:rgb(100, 100, 100);font-size:12px;">StratifiedKFold(n_splits=5, shuffle=True, random_state=SEED)</text>
  <text x="380" y="88" dominant-baseline="central" style="fill:rgb(100, 100, 100);font-size:11px;">— create 5 folds (stratified by <tspan font-weight="bold">Crop, Region</tspan>)</text>

  <!-- Cross-validation row: training (4 folds) + held-out fold -->
  <g>
    <rect x="40" y="92" width="432" height="52" rx="8" style="fill:rgb(200,220,240);stroke:rgb(100,150,200);stroke-width:0.5px;"/>
    <text x="256" y="111" text-anchor="middle" dominant-baseline="central" style="fill:rgb(20,80,160);font-size:14px;font-weight:500;">Train (4 folds per CV iteration)</text>
    <text x="256" y="131" text-anchor="middle" dominant-baseline="central" style="fill:rgb(30,100,180);font-size:12px;">Used for model training (per-fold)</text>
  </g>

  <g>
    <rect x="480" y="92" width="160" height="52" rx="8" style="fill:rgb(220,160,120);stroke:rgb(180,110,60);stroke-width:0.5px;"/>
    <text x="560" y="111" text-anchor="middle" dominant-baseline="central" style="fill:rgb(120,50,20);font-size:14px;font-weight:500;">Held‑out fold</text>
    <text x="560" y="131" text-anchor="middle" dominant-baseline="central" style="fill:rgb(140,60,30);font-size:12px;">Per‑fold test set (varies across folds)</text>
  </g>

  <line x1="256" y1="144" x2="256" y2="172" marker-end="url(#arrow)" style="fill:none;stroke:rgb(120, 120, 120);stroke-width:1.5px;"/>
  <text x="296" y="160" dominant-baseline="central" style="fill:rgb(100,100,100);font-size:12px;">Per‑fold training loop — repeated 5 times</text>

  <!-- Per‑fold train/validation row -->
  <g>
    <rect x="40" y="172" width="346" height="52" rx="8" style="fill:rgb(140,200,180);stroke:rgb(60,150,120);stroke-width:0.5px;"/>
    <text x="213" y="191" text-anchor="middle" dominant-baseline="central" style="fill:rgb(10,100,80);font-size:14px;font-weight:500;">Train fold (4 folds)</text>
    <text x="213" y="211" text-anchor="middle" dominant-baseline="central" style="fill:rgb(20,120,90);font-size:12px;">Model weights updated here</text>
  </g>

  <g>
    <rect x="400" y="172" width="200" height="52" rx="8" style="fill:rgb(220,180,100);stroke:rgb(200,130,20);stroke-width:0.5px;"/>
    <text x="500" y="191" text-anchor="middle" dominant-baseline="central" style="fill:rgb(150,100,0);font-size:14px;font-weight:500;">Validation (10% of train)</text>
    <text x="500" y="211" text-anchor="middle" dominant-baseline="central" style="fill:rgb(170,110,20);font-size:12px;">Keras fit uses validation_split=0.1 (early stopping)</text>
  </g>

  <line x1="213" y1="224" x2="213" y2="252" marker-end="url(#arrow)" style="fill:none;stroke:rgb(120, 120, 120);stroke-width:1.5px;"/>
  <text x="253" y="240" dominant-baseline="central" style="fill:rgb(100,100,100);font-size:12px;">Validation held out from training using validation_split=0.1</text>

  <!-- Evaluation arrows -->
  <line x1="213" y1="304" x2="213" y2="332" marker-end="url(#arrow)" style="fill:none;stroke:rgb(120, 120, 120);stroke-width:1.5px;"/>
  <line x1="500" y1="224" x2="500" y2="332" stroke="#8B7000" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)" style="mask:none"/>

  <!-- Results / evaluation row -->
  <g>
    <rect x="40" y="332" width="600" height="52" rx="8" style="fill:rgb(180,170,220);stroke:rgb(120,100,200);stroke-width:0.5px;"/>
    <text x="340" y="351" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60,40,160);font-size:14px;font-weight:500;">Evaluation</text>
    <text x="340" y="371" text-anchor="middle" dominant-baseline="central" style="fill:rgb(80,60,180);font-size:12px;">Train fold R² · Val fold R² (×5 folds) · Ensemble / aggregated test metrics</text>
  </g>

</svg>