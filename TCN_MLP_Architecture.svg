<svg viewBox="0 0 1600 1450" xmlns="http://www.w3.org/2000/svg" style="background-color: #1a1a1a; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <style>
      .title { font-size: 32px; font-weight: bold; text-anchor: middle; fill: #ffffff; }
      .section { font-size: 18px; font-weight: bold; fill: #ffffff; }
      .label { font-size: 14px; font-weight: bold; text-anchor: middle; fill: #ffffff; }
      .small { font-size: 11px; text-anchor: middle; fill: #e0e0e0; }
      .legend { font-size: 11px; fill: #e0e0e0; }
      .note { font-size: 10px; fill: #e0e0e0; }
    </style>
  </defs>

  <text x="800" y="42" class="title">TCN-MLP Hybrid Architecture (12-Month Climate Sequences, 4-Crop Yield Prediction)</text>

  <text x="70" y="84" class="section">Inputs</text>
  <g id="inputs">
    <rect x="50" y="110" width="240" height="70" fill="#1f77b4" stroke="#ffffff" stroke-width="2" rx="6"/>
    <text x="170" y="140" class="label">Sequence Input</text>
    <text x="170" y="160" class="small">(12, n_features) monthly climate features</text>

    <rect x="330" y="110" width="180" height="70" fill="#2ca02c" stroke="#ffffff" stroke-width="2" rx="6"/>
    <text x="420" y="140" class="label">Region Input</text>
    <text x="420" y="160" class="small">6 regions</text>

    <rect x="550" y="110" width="180" height="70" fill="#2ca02c" stroke="#ffffff" stroke-width="2" rx="6"/>
    <text x="640" y="140" class="label">Crop Input</text>
    <text x="640" y="160" class="small">4 crops</text>

    <rect x="770" y="110" width="200" height="70" fill="#ff7f0e" stroke="#ffffff" stroke-width="2" rx="6"/>
    <text x="870" y="140" class="label">Year Input</text>
    <text x="870" y="160" class="small">3 features: year, sin, cos</text>
  </g>

  <text x="70" y="225" class="section">TCN Branch</text>
  <g id="tcn-branch">
    <line x1="170" y1="180" x2="170" y2="230" stroke="#ffffff" stroke-width="2"/>
    <rect x="50" y="235" width="240" height="70" fill="#9467bd" stroke="#ffffff" stroke-width="2" rx="6"/>
    <text x="170" y="266" class="label">Conv1D</text>
    <text x="170" y="286" class="small">48 filters, kernel=3, causal, relu</text>

    <line x1="170" y1="305" x2="170" y2="335" stroke="#ffffff" stroke-width="2"/>
    <rect x="50" y="340" width="240" height="70" fill="#6c757d" stroke="#ffffff" stroke-width="2" rx="6"/>
    <text x="170" y="370" class="label">Batch Norm + Dropout</text>
    <text x="170" y="390" class="small">dropout = 0.12</text>

    <line x1="170" y1="410" x2="170" y2="440" stroke="#ffffff" stroke-width="2"/>
    <rect x="50" y="445" width="240" height="80" fill="#d62728" stroke="#ffffff" stroke-width="2" rx="6"/>
    <text x="170" y="478" class="label">Residual Block 1</text>
    <text x="170" y="498" class="small">Conv1D 48 filters, dilation=2</text>
    <text x="170" y="514" class="small">Add residual input</text>

    <line x1="170" y1="525" x2="170" y2="555" stroke="#ffffff" stroke-width="2"/>
    <rect x="50" y="560" width="240" height="80" fill="#d62728" stroke="#ffffff" stroke-width="2" rx="6"/>
    <text x="170" y="593" class="label">Residual Block 2</text>
    <text x="170" y="613" class="small">Conv1D 48 filters, dilation=4</text>
    <text x="170" y="629" class="small">Add residual input</text>

    <line x1="170" y1="640" x2="170" y2="670" stroke="#ffffff" stroke-width="2"/>
    <rect x="50" y="675" width="240" height="70" fill="#17becf" stroke="#ffffff" stroke-width="2" rx="6"/>
    <text x="170" y="706" class="label">Conv1D 1×1</text>
    <text x="170" y="726" class="small">32 filters</text>

    <line x1="170" y1="745" x2="170" y2="775" stroke="#ffffff" stroke-width="2"/>
    <rect x="40" y="780" width="260" height="70" fill="#1f9e89" stroke="#ffffff" stroke-width="2" rx="6"/>
    <text x="170" y="811" class="label">Global Avg + Max Pooling</text>
    <text x="170" y="831" class="small">64-dim TCN vector</text>
  </g>

  <text x="340" y="225" class="section">Categorical Branches</text>
  <g id="categorical-branches">
    <line x1="420" y1="180" x2="420" y2="250" stroke="#ffffff" stroke-width="2"/>
    <rect x="330" y="255" width="180" height="70" fill="#2ca02c" stroke="#ffffff" stroke-width="2" rx="6"/>
    <text x="420" y="286" class="label">Region Embedding</text>
    <text x="420" y="306" class="small">6 → 4 dims</text>

    <line x1="420" y1="325" x2="420" y2="365" stroke="#ffffff" stroke-width="2"/>
    <rect x="330" y="370" width="180" height="50" fill="#66bb6a" stroke="#ffffff" stroke-width="1.5" rx="6"/>
    <text x="420" y="401" class="label">Flatten</text>

    <line x1="640" y1="180" x2="640" y2="250" stroke="#ffffff" stroke-width="2"/>
    <rect x="550" y="255" width="180" height="70" fill="#2ca02c" stroke="#ffffff" stroke-width="2" rx="6"/>
    <text x="640" y="286" class="label">Crop Embedding</text>
    <text x="640" y="306" class="small">4 → 4 dims</text>

    <line x1="640" y1="325" x2="640" y2="365" stroke="#ffffff" stroke-width="2"/>
    <rect x="550" y="370" width="180" height="50" fill="#66bb6a" stroke="#ffffff" stroke-width="1.5" rx="6"/>
    <text x="640" y="401" class="label">Flatten</text>
  </g>

  <text x="770" y="225" class="section">Trend Branch</text>
  <g id="trend-branch">
    <line x1="870" y1="180" x2="870" y2="250" stroke="#ffffff" stroke-width="2"/>
    <rect x="770" y="255" width="200" height="70" fill="#ff7f0e" stroke="#ffffff" stroke-width="2" rx="6"/>
    <text x="870" y="286" class="label">Dense(16)</text>
    <text x="870" y="306" class="small">ReLU + Dropout</text>

    <line x1="870" y1="325" x2="870" y2="365" stroke="#ffffff" stroke-width="2"/>
    <rect x="770" y="370" width="200" height="50" fill="#ffb347" stroke="#ffffff" stroke-width="1.5" rx="6"/>
    <text x="870" y="401" class="label">Dropout</text>
    <text x="870" y="417" class="note" text-anchor="middle">0.12</text>
  </g>

  <text x="70" y="940" class="section">Fusion</text>
  <g id="fusion">
    <line x1="170" y1="850" x2="770" y2="940" stroke="#ffffff" stroke-width="1.6"/>
    <line x1="420" y1="420" x2="770" y2="940" stroke="#ffffff" stroke-width="1.6"/>
    <line x1="640" y1="420" x2="770" y2="940" stroke="#ffffff" stroke-width="1.6"/>
    <line x1="870" y1="420" x2="770" y2="940" stroke="#ffffff" stroke-width="1.6"/>

    <rect x="650" y="940" width="330" height="75" fill="#8b7500" stroke="#ffffff" stroke-width="2" rx="6"/>
    <text x="815" y="972" class="label">Concatenate All Inputs</text>
    <text x="815" y="992" class="small">[64 + 4 + 4 + 16] = 88-dim vector</text>
  </g>

  <text x="70" y="1085" class="section">MLP Head</text>
  <g id="mlp-head">
    <line x1="815" y1="1015" x2="815" y2="1080" stroke="#ffffff" stroke-width="2"/>

    <rect x="680" y="1085" width="270" height="75" fill="#c85a54" stroke="#ffffff" stroke-width="2" rx="6"/>
    <text x="815" y="1116" class="label">Dense(40)</text>
    <text x="815" y="1136" class="small">ReLU + BatchNorm + Dropout</text>

    <line x1="815" y1="1160" x2="815" y2="1200" stroke="#ffffff" stroke-width="2"/>
    <rect x="680" y="1205" width="270" height="70" fill="#c85a54" stroke="#ffffff" stroke-width="2" rx="6"/>
    <text x="815" y="1236" class="label">Dense(20)</text>
    <text x="815" y="1256" class="small">ReLU + Dropout</text>

    <line x1="815" y1="1275" x2="815" y2="1315" stroke="#ffffff" stroke-width="2"/>
    <rect x="680" y="1320" width="270" height="70" fill="#1f77b4" stroke="#ffffff" stroke-width="2" rx="6"/>
    <text x="815" y="1351" class="label">Output Layer</text>
    <text x="815" y="1371" class="small">Linear activation, normalized log-yield</text>
  </g>

  <text x="1085" y="84" class="section">Training Setup</text>
  <g id="legend">
    <rect x="1040" y="110" width="500" height="330" fill="#2a2a2a" stroke="#666666" stroke-width="1" rx="6" opacity="0.95"/>
    <text x="1290" y="140" class="label">Model Configuration</text>
    <text x="1060" y="170" class="legend">• Sequence: 12 months × n_features climate input</text>
    <text x="1060" y="192" class="legend">• Region embedding: 6 categories → 4 dims</text>
    <text x="1060" y="214" class="legend">• Crop embedding: 4 categories → 4 dims</text>
    <text x="1060" y="236" class="legend">• Year features: normalized year + sin + cos</text>
    <text x="1060" y="258" class="legend">• TCN: Conv1D 48 → residual dilated 48 → residual dilated 48 → Conv1D 32</text>
    <text x="1060" y="280" class="legend">• Pooling: GlobalAveragePooling1D + GlobalMaxPooling1D</text>
    <text x="1060" y="302" class="legend">• Dense head: 40 → 20 → 1</text>
    <text x="1060" y="324" class="legend">• Optimizer: AdamW, lr = 3e-4, weight_decay = 3e-4, clipnorm = 1.0</text>
    <text x="1060" y="346" class="legend">• Loss: Huber(delta = 0.35)</text>
    <text x="1060" y="368" class="legend">• Regularization: L2 = 1e-3, dropout = 0.12</text>
    <text x="1060" y="390" class="legend">• Training: 5-fold stratified CV by crop-region group</text>
    <text x="1060" y="412" class="legend">• Output is denormalized outside the model to yield (kg/ha)</text>
  </g>

  <text x="1085" y="495" class="section">Why This Works</text>
  <g id="rationale">
    <rect x="1040" y="520" width="500" height="190" fill="#2a2a2a" stroke="#666666" stroke-width="1" rx="6" opacity="0.95"/>
    <text x="1060" y="552" class="legend">✓ Causal convolutions respect month order and avoid leakage.</text>
    <text x="1060" y="576" class="legend">✓ Dilations capture short and medium seasonal dependencies.</text>
    <text x="1060" y="600" class="legend">✓ Pooling compresses the 12-month sequence into summary signals.</text>
    <text x="1060" y="624" class="legend">✓ Region and crop embeddings let the model learn context-specific responses.</text>
    <text x="1060" y="648" class="legend">✓ The year branch captures long-term trend effects and cyclical drift.</text>
    <text x="1060" y="672" class="legend">✓ The MLP head fuses climate, crop, region, and trend information into one regression output.</text>
  </g>
</svg>